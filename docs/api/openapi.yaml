openapi: 3.1.0
info:
  title: Zee-Index API
  description: |
    Core API documentation for Zee-Index - a self-hosted Google Drive CMS,
    explorer, and streaming platform.

    ## Authentication
    Most endpoints support one of:
    - **sessionAuth** — NextAuth.js JWT session cookie (`next-auth.session-token`)
    - **apiKeyAuth** — `Authorization: Bearer <zk_xxx>` header (see API Keys section)
    - **shareToken** — `share_token` query parameter for shared links
    - **accessToken** — `access_token` query parameter for protected folders

    ## Rate Limiting
    - General API: 500 requests per minute
    - Download API: 100 requests per hour
    - Auth API: 20 requests per 5 minutes
    - Admin API: 50 requests per minute
    - **API Key**: 1000 requests per minute

    ## Error Responses
    Most errors follow this format:
    ```json
    {
      "error": "Error message"
    }
    ```
  version: 2.0.0
  contact:
    name: Zee-Index Support
    url: https://github.com/ifauzeee/Zee-Index/issues
  license:
    name: AGPL-3.0
    url: https://www.gnu.org/licenses/agpl-3.0.html

servers:
  - url: http://localhost:3000
    description: Development server
  - url: https://zee-index.duckdns.org
    description: Production server

tags:
  - name: Files
    description: File and folder operations
  - name: Auth
    description: Authentication endpoints
  - name: Admin
    description: Admin-only operations
  - name: Share
    description: Share link management
  - name: Search
    description: File search operations (including full-text content search)
  - name: API Keys
    description: API key management for programmatic access
  - name: Health
    description: Health check endpoints

paths:
  # ==============================================================================
  # HEALTH ENDPOINTS
  # ==============================================================================
  /api/health:
    get:
      tags:
        - Health
      summary: Health check
      description: Check the health status of the application and its dependencies
      operationId: healthCheck
      responses:
        "200":
          description: All services healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: One or more services unhealthy

  /api/admin/system-health:
    get:
      tags:
        - Admin
        - Health
      summary: Read operational system health
      description: Returns measured dependency health, latency summary, and 24h error counts for the admin dashboard
      operationId: getAdminSystemHealth
      security:
        - sessionAuth: []
      responses:
        "200":
          description: System health payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSystemHealthResponse"

  # ==============================================================================
  # FILE ENDPOINTS
  # ==============================================================================
  /api/files:
    get:
      tags:
        - Files
      summary: List files in a folder
      description: Get a paginated list of files and folders within a specified folder
      operationId: listFiles
      parameters:
        - name: folderId
          in: query
          required: true
          schema:
            type: string
          description: Google Drive folder ID
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 100
          description: Number of items per page
        - name: pageToken
          in: query
          schema:
            type: string
          description: Token for pagination
        - name: share_token
          in: query
          schema:
            type: string
          description: Share token for public access
      responses:
        "200":
          description: List of files
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileListResponse"
        "401":
          description: Unauthorized or folder protected
        "404":
          description: Folder not found

  /api/filedetails:
    get:
      tags:
        - Files
      summary: Get file details
      description: Get detailed metadata for a specific file
      operationId: getFileDetails
      parameters:
        - name: fileId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: File details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriveFile"

  /api/download:
    get:
      tags:
        - Files
      summary: Download a file
      description: Initiate file download from Google Drive
      operationId: downloadFile
      parameters:
        - name: fileId
          in: query
          required: true
          schema:
            type: string
        - name: share_token
          in: query
          schema:
            type: string
        - name: access_token
          in: query
          schema:
            type: string
          description: Folder access token for protected folders
      responses:
        "200":
          description: File stream
        "302":
          description: Redirect to Google Drive download URL
        "401":
          description: Unauthorized
        "404":
          description: File not found

  /api/search:
    get:
      tags:
        - Files
        - Search
      summary: Search files within a folder
      description: Search for files within a specific folder. Supports name and full-text search.
      operationId: searchFiles
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
          description: Search query
        - name: folderId
          in: query
          schema:
            type: string
          description: Folder ID to search within (optional, searches root if omitted)
        - name: searchType
          in: query
          schema:
            type: string
            enum: [name, fullText]
            default: name
          description: Search mode — "name" searches file names, "fullText" searches file names + extracted content (PDF/DOCX/TXT)
        - name: mimeType
          in: query
          schema:
            type: string
            enum: [image, video, audio, pdf, folder]
          description: Filter by file type
        - name: modifiedTime
          in: query
          schema:
            type: string
            enum: [today, week, month]
          description: Filter by last modified time
        - name: minSize
          in: query
          schema:
            type: integer
          description: Minimum file size in MB
      responses:
        "200":
          description: Search results (files array + pagination token)
          content:
            application/json:
              schema:
                type: object
                properties:
                  files:
                    type: array
                    items:
                      $ref: "#/components/schemas/DriveFile"
                  nextPageToken:
                    type: string
                    nullable: true
        "400":
          description: Missing search criteria

  /api/search/global:
    get:
      tags:
        - Files
        - Search
      summary: Global search across all drives
      description: Search across all descendant folders of the root. Merges Google Drive results with local Postgres full-text index.
      operationId: searchGlobal
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
          description: Search query
        - name: searchType
          in: query
          schema:
            type: string
            enum: [name, fullText]
            default: name
          description: Search mode
        - name: mimeType
          in: query
          schema:
            type: string
            enum: [image, video, audio, pdf, folder]
          description: Filter by file type
        - name: modifiedTime
          in: query
          schema:
            type: string
            enum: [today, week, month]
          description: Filter by last modified time
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  files:
                    type: array
                    items:
                      $ref: "#/components/schemas/DriveFile"
        "400":
          description: Missing search term

  /api/search/index:
    post:
      tags:
        - Search
      summary: Index file content for full-text search
      description: Extract text content from files (PDF, DOCX, TXT, code) and store in the Postgres search index. Accepts an optional fileId or indexes all pending files.
      operationId: indexFileContent
      security:
        - sessionAuth: []
        - apiKeyAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                fileId:
                  type: string
                  description: Specific file ID to index. If omitted, indexes all pending files.
      responses:
        "200":
          description: Indexing complete
          content:
            application/json:
              schema:
                type: object
                properties:
                  indexed:
                    type: integer
                    description: Number of files indexed
                  errors:
                    type: integer
                    description: Number of files that failed to index
        "401":
          description: Unauthorized

  /api/files/upload:
    post:
      tags:
        - Files
      summary: Upload a file
      description: Upload a file to Google Drive (Admin only)
      operationId: uploadFile
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                folderId:
                  type: string
      responses:
        "200":
          description: Upload successful
        "401":
          description: Unauthorized
        "403":
          description: Admin access required

  /api/files/rename:
    post:
      tags:
        - Files
      summary: Rename a file
      description: Rename a file or folder (Admin/Editor only)
      operationId: renameFile
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - fileId
                - newName
              properties:
                fileId:
                  type: string
                newName:
                  type: string
      responses:
        "200":
          description: Rename successful
        "401":
          description: Unauthorized

  /api/files/move:
    post:
      tags:
        - Files
      summary: Move a file
      description: Move a file or folder to a new parent folder (Admin/Editor only)
      operationId: moveFile
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - fileId
                - currentParentId
                - newParentId
              properties:
                fileId:
                  type: string
                currentParentId:
                  type: string
                newParentId:
                  type: string
      responses:
        "200":
          description: Move successful
        "401":
          description: Unauthorized

  /api/files/copy:
    post:
      tags:
        - Files
      summary: Copy a file
      description: Copy a file to a target parent folder (Admin/Editor only)
      operationId: copyFile
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - fileId
              properties:
                fileId:
                  type: string
                destinationId:
                  type: string
                  description: Target parent folder ID (optional)
                newName:
                  type: string
                  description: Optional new name for the copied file
      responses:
        "200":
          description: Copy successful
        "401":
          description: Unauthorized

  /api/files/delete:
    post:
      tags:
        - Files
      summary: Delete a file
      description: Move file to trash or delete from storage (Admin/Editor only)
      operationId: deleteFile
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - fileId
              properties:
                fileId:
                  type: string
      responses:
        "200":
          description: Delete successful
        "401":
          description: Unauthorized

  # ==============================================================================
  # AUTH ENDPOINTS
  # ==============================================================================
  /api/auth/me:
    get:
      tags:
        - Auth
      summary: Get current user
      description: Get the currently authenticated user's information
      operationId: getCurrentUser
      responses:
        "200":
          description: User information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not authenticated

  /api/auth/folder:
    post:
      tags:
        - Auth
      summary: Authenticate to protected folder
      description: Submit credentials to access a protected folder
      operationId: authenticateFolder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - folderId
                - password
              properties:
                folderId:
                  type: string
                id:
                  type: string
                  description: Optional user ID
                password:
                  type: string
      responses:
        "200":
          description: Access granted
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
        "401":
          description: Invalid credentials

  # ==============================================================================
  # SHARE ENDPOINTS
  # ==============================================================================
  /api/share:
    post:
      tags:
        - Share
      summary: Create share link
      description: Create a shareable link for a file or folder (Admin only)
      operationId: createShareLink
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - itemName
                - type
                - expiresIn
              properties:
                path:
                  type: string
                  description: Required for single-item shares
                itemName:
                  type: string
                type:
                  type: string
                  enum: [timed, session]
                expiresIn:
                  type: string
                  default: 7d
                  description: Duration string such as 1h, 7d, or 30d
                loginRequired:
                  type: boolean
                  default: false
                items:
                  type: array
                  description: Include to create a shared collection
                  items:
                    $ref: "#/components/schemas/DriveFile"
                maxUses:
                  type: integer
                  nullable: true
                preventDownload:
                  type: boolean
                hasWatermark:
                  type: boolean
                watermarkText:
                  type: string
                  nullable: true
      responses:
        "200":
          description: Share link created
          content:
            application/json:
              schema:
                type: object
                properties:
                  shareableUrl:
                    type: string
                  token:
                    type: string
                  jti:
                    type: string
                  newShareLink:
                    $ref: "#/components/schemas/ShareLink"
        "401":
          description: Unauthorized

  /api/share/list:
    get:
      tags:
        - Share
      summary: List share links
      description: Get all active share links (Admin only)
      operationId: listShareLinks
      security:
        - sessionAuth: []
      responses:
        "200":
          description: List of share links
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ShareLink"

  /api/share/delete:
    post:
      tags:
        - Share
      summary: Delete share link
      description: Delete a share link (Admin only)
      operationId: deleteShareLink
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShareLink"
      responses:
        "200":
          description: Share link deleted
        "401":
          description: Unauthorized

  /api/share/revoke:
    post:
      tags:
        - Share
      summary: Revoke a share token
      description: Blocks an existing share token until its original expiry time
      operationId: revokeShareLink
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - jti
                - expiresAt
              properties:
                jti:
                  type: string
                expiresAt:
                  type: string
                  format: date-time
      responses:
        "200":
          description: Share link revoked

  /api/share/status:
    post:
      tags:
        - Share
      summary: Check share token status
      description: Validates whether a share token is still usable
      operationId: getShareStatus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - shareToken
              properties:
                shareToken:
                  type: string
      responses:
        "200":
          description: Validation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
                  error:
                    type: string

  /api/share/track:
    post:
      tags:
        - Share
      summary: Track share access
      description: Increments the view count for a share link
      operationId: trackShareAccess
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - shareToken
              properties:
                shareToken:
                  type: string
      responses:
        "204":
          description: Access tracked

  /api/share/items/{shareId}:
    get:
      tags:
        - Share
      summary: Read shared collection items
      description: Resolves the items stored for a collection share
      operationId: getSharedCollectionItems
      parameters:
        - name: shareId
          in: path
          required: true
          schema:
            type: string
        - name: share_token
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Collection contents
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/DriveFile"
                  collectionName:
                    type: string

  /api/share/{id}:
    patch:
      tags:
        - Share
      summary: Update share link settings
      description: Update settings (expiration, passwords, watermark, etc.) of an active share link (Admin only)
      operationId: updateShareLink
      security:
        - sessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: The ID of the share link to update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                loginRequired:
                  type: boolean
                maxUses:
                  type: integer
                  nullable: true
                preventDownload:
                  type: boolean
                hasWatermark:
                  type: boolean
                watermarkText:
                  type: string
                  nullable: true
                expiresAt:
                  type: string
                  format: date-time
      responses:
        "200":
          description: Share link updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  updatedShareLink:
                    $ref: "#/components/schemas/ShareLink"
        "401":
          description: Unauthorized
        "404":
          description: Share link not found

  # ==============================================================================
  # ADMIN ENDPOINTS
  # ==============================================================================
  /api/admin/config:
    get:
      tags:
        - Admin
      summary: Get app configuration
      description: Get current application configuration
      operationId: getConfig
      security:
        - sessionAuth: []
      responses:
        "200":
          description: Configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppConfig"
    post:
      tags:
        - Admin
      summary: Update app configuration
      description: Update application configuration (Admin only)
      operationId: updateConfig
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppConfig"
      responses:
        "200":
          description: Configuration updated
        "401":
          description: Unauthorized

  /api/admin/users:
    get:
      tags:
        - Admin
      summary: List admin users
      description: Get list of admin email addresses
      operationId: listAdmins
      security:
        - sessionAuth: []
      responses:
        "200":
          description: List of admin emails
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
    post:
      tags:
        - Admin
      summary: Add admin user
      description: Add a new admin user
      operationId: addAdmin
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
      responses:
        "200":
          description: Admin added
        "401":
          description: Unauthorized
    delete:
      tags:
        - Admin
      summary: Remove admin user
      description: Remove an admin user
      operationId: removeAdmin
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
      responses:
        "200":
          description: Admin removed
        "401":
          description: Unauthorized

  /api/admin/activity-log:
    get:
      tags:
        - Admin
      summary: Get activity logs
      description: Get system activity logs
      operationId: getActivityLogs
      security:
        - sessionAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Activity logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityLog"

  /api/admin/api-keys:
    get:
      tags:
        - Admin
        - API Keys
      summary: List API keys
      description: Get all API keys with masked hashes. Only admins can access this.
      operationId: listApiKeys
      security:
        - sessionAuth: []
      responses:
        "200":
          description: List of API keys
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiKey"
        "401":
          description: Unauthorized
    post:
      tags:
        - Admin
        - API Keys
      summary: Create API key
      description: Create a new API key with specified permissions. The raw key is returned **only once** in the response.
      operationId: createApiKey
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApiKeyRequest"
      responses:
        "200":
          description: API key created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateApiKeyResponse"
        "401":
          description: Unauthorized

  /api/admin/api-keys/{id}:
    delete:
      tags:
        - Admin
        - API Keys
      summary: Revoke API key
      description: Revoke (soft-delete) an API key. Clears its Redis cache entry.
      operationId: revokeApiKey
      security:
        - sessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: API key ID to revoke
      responses:
        "200":
          description: API key revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
        "401":
          description: Unauthorized
        "404":
          description: API key not found

# ==============================================================================
# COMPONENTS
# ==============================================================================
components:
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: next-auth.session-token
      description: NextAuth.js session cookie
    apiKeyAuth:
      type: http
      scheme: bearer
      bearerFormat: zk_
      description: API key with bearer format (zk_ prefix). Create one from the admin panel.

  schemas:
    DriveFile:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        mimeType:
          type: string
        size:
          type: string
        modifiedTime:
          type: string
          format: date-time
        createdTime:
          type: string
          format: date-time
        isFolder:
          type: boolean
        hasThumbnail:
          type: boolean
        thumbnailLink:
          type: string
        webViewLink:
          type: string
        parents:
          type: array
          items:
            type: string
        trashed:
          type: boolean

    FileListResponse:
      type: object
      properties:
        files:
          type: array
          items:
            $ref: "#/components/schemas/DriveFile"
        nextPageToken:
          type: string
          nullable: true
        folderPath:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string

    User:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        image:
          type: string
        role:
          type: string
          enum: [USER, ADMIN, GUEST]
        isGuest:
          type: boolean

    ShareLink:
      type: object
      properties:
        id:
          type: string
        path:
          type: string
        token:
          type: string
        jti:
          type: string
        expiresAt:
          type: string
          format: date-time
        loginRequired:
          type: boolean
        itemName:
          type: string
        viewCount:
          type: integer
        isCollection:
          type: boolean
        maxUses:
          type: integer
          nullable: true
        preventDownload:
          type: boolean
        hasWatermark:
          type: boolean
        watermarkText:
          type: string
          nullable: true

    AppConfig:
      type: object
      properties:
        hideAuthor:
          type: boolean
        disableGuestLogin:
          type: boolean
        appName:
          type: string
        logoUrl:
          type: string
        faviconUrl:
          type: string
        primaryColor:
          type: string

    ActivityLog:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        timestamp:
          type: integer
        severity:
          type: string
          enum: [info, warning, error, critical]
        userEmail:
          type: string
        itemName:
          type: string
        status:
          type: string
        ipAddress:
          type: string

