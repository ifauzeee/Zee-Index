                  type: integer

    ApiKey:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
          description: Human-friendly label for the key
        keyPrefix:
          type: string
          description: First 8 characters of the raw key (zk_abc123...)
        permissions:
          type: array
          items:
            type: string
            enum: [files:read, files:write, share:read, share:write, admin:read, admin:write]
          description: Granular permissions assigned to this key
        status:
          type: string
          enum: [active, revoked]
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
        expiresAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - keyPrefix
        - permissions
        - status

    CreateApiKeyRequest:
      type: object
      required:
        - name
        - permissions
      properties:
        name:
          type: string
          description: Label for the key (e.g. "CI/CD Deploy")
        permissions:
          type: array
          items:
            type: string
            enum: [files:read, files:write, share:read, share:write, admin:read, admin:write]
          description: One or more permissions
        expiresAt:
          type: string
          format: date-time
          description: Optional expiration date

    CreateApiKeyResponse:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        keyPrefix:
          type: string
        rawKey:
          type: string
          description: "⚠️ The full raw API key. Shown only once — save it immediately."
        permissions:
          type: array
          items:
            type: string
        expiresAt:
          type: string
          format: date-time
          nullable: true
      required:
        - id
        - name
        - keyPrefix
        - rawKey
        - permissions

    Error:
      type: object
      properties:
        error:
          type: string
        details:
          oneOf:
            - type: string
            - type: array
              items:
                type: object
