            cache:
              allOf:
                - $ref: "#/components/schemas/ServiceHealth"
                - type: object
                  properties:
                    backend:
                      type: string
                      enum: [redis, memory]
            google_drive:
              $ref: "#/components/schemas/GoogleDriveHealth"

    ServiceHealth:
      type: object
      properties:
        status:
          type: string
          enum: [healthy, unhealthy, not_configured]
        latency:
          type: integer
        checkedAt:
          type: string
          format: date-time
        error:
          type: string

    GoogleDriveHealth:
